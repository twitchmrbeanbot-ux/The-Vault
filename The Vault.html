<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Vault – Retro Days</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#08080f;color:#ddd;min-height:100vh;padding-bottom:58px}
header{background:#0d0d16;border-bottom:1px solid #1a1a2a;padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.logo{font-size:22px;font-weight:800;color:#fff;letter-spacing:2px;text-transform:uppercase}
.logo-sub{font-size:11px;color:#c0392b;font-weight:700;letter-spacing:3px;text-transform:uppercase;align-self:flex-end;padding-bottom:3px}
.hstats{display:flex;gap:18px;margin-left:auto;font-size:12px;color:#666;flex-wrap:wrap}
.hstats strong{color:#c8a951}
.toolbar{background:#0d0d16;border-bottom:1px solid #111;padding:10px 24px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;position:sticky;top:57px;z-index:99}
#search{background:#13131e;border:1px solid #222;color:#ddd;padding:7px 13px;border-radius:5px;font-size:13px;width:220px;outline:none}
#search:focus{border-color:#c8a951}
.fbtn{background:#13131e;border:1px solid #222;color:#666;padding:5px 11px;border-radius:4px;cursor:pointer;font-size:12px;transition:all .12s;white-space:nowrap}
.fbtn:hover,.fbtn.on{background:#c8a951;border-color:#c8a951;color:#0a0a0f;font-weight:700}
.vbtns{display:flex;gap:5px;margin-left:auto}
.vbtn{background:#13131e;border:1px solid #222;color:#555;padding:5px 9px;border-radius:4px;cursor:pointer;font-size:13px}
.vbtn.on{background:#1a1a1a;color:#c8a951;border-color:#333}
main{padding:20px 24px}
.sys-section{margin-bottom:40px;border-radius:10px;overflow:hidden;border:1px solid #222}
.sys-header{display:flex;align-items:center;gap:16px;padding:16px 20px;min-height:80px}
.sys-logo-img{height:52px;width:auto;max-width:220px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 2px 10px rgba(0,0,0,.95))}
.sys-info{flex:1;min-width:0}
.sys-info h2{font-size:15px;font-weight:700;color:#fff}
.sys-info p{font-size:11px;color:#ccc;margin-top:3px}
.sys-done{text-align:right;flex-shrink:0}
.sys-done strong{font-size:22px;color:#fff;display:block}
.sys-done span{font-size:10px;color:#bbb}
.prog-bar{height:4px;background:#060606}
.prog-fill{height:100%;transition:width .3s}
.game-grid{padding:4px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:2px;background:#0d0d0d}
.game-grid.list{grid-template-columns:1fr}
.game-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#111118;border-left:2px solid transparent;transition:background .1s}
.game-row:hover{background:#16161f}
.game-row.done{border-left-color:#27ae60}
.game-row.done .gname{color:#7dcea0}
.gnum{color:#222232;font-size:10px;min-width:26px;text-align:right;flex-shrink:0}
.gname{font-size:12.5px;color:#ccc;flex:1;word-break:break-word}
.nbtn{width:20px;height:20px;border-radius:3px;border:1px solid #1e1e2e;background:none;cursor:pointer;font-size:11px;color:#333;flex-shrink:0;transition:all .12s}
.nbtn:hover,.nbtn.hasnote{border-color:#c8a951;color:#c8a951}
.cbtn{width:20px;height:20px;border-radius:3px;border:1px solid #1e1e2e;background:none;cursor:pointer;font-size:12px;color:transparent;flex-shrink:0;transition:all .12s}
.cbtn:hover{border-color:#27ae60;background:rgba(13,31,13,.8)}
.cbtn.done{background:#27ae60;border-color:#27ae60;color:#fff}
.no-results{text-align:center;padding:60px;color:#333;font-size:14px}
.save-bar{position:fixed;bottom:0;left:0;right:0;background:#0d0d16;border-top:1px solid #1a1a2a;padding:9px 24px;display:flex;gap:8px;align-items:center;z-index:100;flex-wrap:wrap}
.save-bar span{font-size:11px;color:#444;flex:1}
.btn{padding:6px 14px;border-radius:4px;border:none;cursor:pointer;font-size:12px;font-weight:700}
.btn-gold{background:#c8a951;color:#0a0a0f}
.btn-out{background:none;border:1px solid #222;color:#666;cursor:pointer;font-size:12px;font-weight:600;padding:6px 14px;border-radius:4px}
.btn-out:hover{border-color:#c8a951;color:#c8a951}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:flex;align-items:center;justify-content:center}
.overlay.hidden{display:none}
.modal{background:#12121c;border:1px solid #222;border-radius:8px;padding:22px;width:380px;max-width:92vw}
.modal h3{font-size:14px;color:#c8a951;margin-bottom:6px}
.modal-game{font-size:12px;color:#666;margin-bottom:10px;word-break:break-word}
.modal textarea{width:100%;background:#08080f;border:1px solid #222;color:#ddd;padding:9px;border-radius:4px;font-size:12px;min-height:80px;resize:vertical;outline:none;font-family:inherit}
.mactions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
</style>
</head>
<body>
<header>
  <div class="logo">The Vault</div>
  <div class="logo-sub">Retro Days</div>
  <div class="hstats">
    <span>Total <strong id="s-total">0</strong></span>
    <span>Done <strong id="s-done">0</strong></span>
    <span><strong id="s-pct">0%</strong></span>
  </div>
</header>
<div class="toolbar">
  <input id="search" type="text" placeholder="Search games..." oninput="render()">
  <button class="fbtn on" data-sys="all" onclick="setSys(this)">All</button>
  <button class="fbtn" data-sys="PlayStation 1" onclick="setSys(this)">PS1</button>
  <button class="fbtn" data-sys="PlayStation 2" onclick="setSys(this)">PS2</button>
  <button class="fbtn" data-sys="PlayStation 3" onclick="setSys(this)">PS3</button>
  <button class="fbtn" data-sys="Nintendo 64" onclick="setSys(this)">N64</button>
  <button class="fbtn" data-sys="GameCube" onclick="setSys(this)">GCN</button>
  <button class="fbtn" data-sys="Game Boy" onclick="setSys(this)">GB</button>
  <button class="fbtn" data-sys="Game Boy Color" onclick="setSys(this)">GBC</button>
  <button class="fbtn" data-sys="Game Boy Advance" onclick="setSys(this)">GBA</button>
  <button class="fbtn" data-sys="Xbox Original" onclick="setSys(this)">Xbox</button>
  <button class="fbtn" data-sys="Xbox 360" onclick="setSys(this)">X360</button>
  <div class="vbtns">
    <button class="vbtn on" id="vg" onclick="setView('grid')">&#x229E;</button>
    <button class="vbtn" id="vl" onclick="setView('list')">&#x2261;</button>
  </div>
</div>
<main id="main"></main>
<div class="save-bar">
  <span id="sstatus">Auto-saves in browser &middot; Export to back up progress</span>
  <button class="btn-out" onclick="doExport()">Export save</button>
  <button class="btn-out" onclick="document.getElementById('fimp').click()">Import save</button>
  <input id="fimp" type="file" accept=".json" style="display:none" onchange="doImport(event)">
  <button class="btn btn-gold" onclick="dlHTML()">Download file</button>
</div>
<div id="modal" class="overlay hidden">
  <div class="modal">
    <h3>Note</h3>
    <div class="modal-game" id="m-title"></div>
    <textarea id="m-text" placeholder="Write your notes here..."></textarea>
    <div class="mactions">
      <button class="btn-out" id="m-cancel">Cancel</button>
      <button class="btn btn-gold" id="m-save">Save note</button>
    </div>
  </div>
</div>

const SYS = {
  'PlayStation 1':   {accent:'#003791',progress:'#0050cc'},
  'PlayStation 2':   {accent:'#0044aa',progress:'#0066dd'},
  'PlayStation 3':   {accent:'#333355',progress:'#5555aa'},
  'Nintendo 64':     {accent:'#aa0008',progress:'#dd0010'},
  'GameCube':        {accent:'#5a2aaa',progress:'#7a4acc'},
  'Game Boy':        {accent:'#2a2a6a',progress:'#4444aa'},
  'Game Boy Color':  {accent:'#993300',progress:'#cc4400'},
  'Game Boy Advance':{accent:'#4400aa',progress:'#6622cc'},
  'Xbox Original':   {accent:'#0a6a0a',progress:'#3a9a3a'},
  'Xbox 360':        {accent:'#3a9a3a',progress:'#60c060'},
};

let completed={}, notes={}, curSys='all', curView='grid', noteIdx=null, gameMap=[];
function gk(s,n){return s+'||'+n;}
function loadSave(){try{const d=JSON.parse(localStorage.getItem('vault8')||'{}');completed=d.c||{};notes=d.n||{};}catch(e){}}
function doSave(){localStorage.setItem('vault8',JSON.stringify({c:completed,n:notes}));updateStats();}
function updateStats(){
  const total=Object.values(GAMES).reduce((a,g)=>a+g.length,0);
  const done=Object.keys(completed).length;
  document.getElementById('s-total').textContent=total.toLocaleString();
  document.getElementById('s-done').textContent=done.toLocaleString();
  document.getElementById('s-pct').textContent=Math.round(done/total*100)+'%';
}
function setSys(btn){curSys=btn.dataset.sys;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');render();}
function setView(v){curView=v;document.getElementById('vg').classList.toggle('on',v==='grid');document.getElementById('vl').classList.toggle('on',v==='list');render();}

function render(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const main=document.getElementById('main');
  main.innerHTML=''; gameMap=[];
  const systems=curSys==='all'?Object.keys(GAMES):[curSys];
  let any=false;
  systems.forEach(sys=>{
    const games=GAMES[sys];
    const filtered=q?games.filter(g=>g.toLowerCase().includes(q)):games;
    if(!filtered.length)return;
    any=true;
    const m=SYS[sys]||{accent:'#444',progress:'#888'};
    const doneCount=filtered.filter(g=>completed[gk(sys,g)]).length;
    const pct=filtered.length?Math.round(doneCount/filtered.length*100):0;

    const sec=document.createElement('div');
    sec.className='sys-section';
    sec.style.borderColor=m.accent+'66';

    const hdr=document.createElement('div');
    hdr.className='sys-header';
    hdr.style.background='linear-gradient(135deg, '+m.accent+'ee 0%, '+m.accent+'55 30%, #0d0d1a 100%)';
    hdr.style.borderBottom='1px solid '+m.accent+'44';

    if(IMG[sys]){
      const logo=document.createElement('img');
      logo.src=IMG[sys];logo.className='sys-logo-img';logo.alt=sys;
      hdr.appendChild(logo);
    }

    const info=document.createElement('div');
    info.className='sys-info';
    info.innerHTML='<h2>'+sys+'</h2><p>'+filtered.length.toLocaleString()+' games in library</p>';
    hdr.appendChild(info);

    const doneEl=document.createElement('div');
    doneEl.className='sys-done';
    doneEl.innerHTML='<strong>'+doneCount+'</strong><span>'+filtered.length+' total &bull; '+pct+'%</span>';
    hdr.appendChild(doneEl);
    sec.appendChild(hdr);

    const pb=document.createElement('div');pb.className='prog-bar';
    const pf=document.createElement('div');pf.className='prog-fill';
    pf.style.cssText='width:'+pct+'%;background:'+m.progress;
    pb.appendChild(pf);sec.appendChild(pb);

    const grid=document.createElement('div');
    grid.className='game-grid'+(curView==='list'?' list':'');

    filtered.forEach((g,i)=>{
      const k=gk(sys,g);
      const isDone=!!completed[k];
      const hasNote=!!notes[k];
      const idx=gameMap.length;
      gameMap.push({sys,name:g});
      const row=document.createElement('div');
      row.className='game-row'+(isDone?' done':'');
      const num=document.createElement('span');num.className='gnum';num.textContent=i+1;
      const nm=document.createElement('span');nm.className='gname';nm.textContent=g;
      const nb=document.createElement('button');
      nb.className='nbtn'+(hasNote?' hasnote':'');
      nb.textContent='✎';nb.title=hasNote?'Edit note':'Add note';
      nb.addEventListener('click',()=>openNote(idx));
      const cb=document.createElement('button');
      cb.className='cbtn'+(isDone?' done':'');
      cb.textContent=isDone?'✓':'';
      cb.addEventListener('click',()=>{
        if(completed[k]){delete completed[k];}else{completed[k]=1;}
        const d=!!completed[k];
        cb.classList.toggle('done',d);cb.textContent=d?'✓':'';
        row.classList.toggle('done',d);
        const nd=filtered.filter(gg=>completed[gk(sys,gg)]).length;
        const np=Math.round(nd/filtered.length*100);
        doneEl.innerHTML='<strong>'+nd+'</strong><span>'+filtered.length+' total &bull; '+np+'%</span>';
        pf.style.width=np+'%';
        doSave();
      });
      row.appendChild(num);row.appendChild(nm);row.appendChild(nb);row.appendChild(cb);
      grid.appendChild(row);
    });
    sec.appendChild(grid);main.appendChild(sec);
  });
  if(!any)main.innerHTML='<div class="no-results">No games found</div>';
  updateStats();
}

function openNote(idx){
  noteIdx=idx;
  const {sys,name}=gameMap[idx];
  document.getElementById('m-title').textContent=name;
  document.getElementById('m-text').value=notes[gk(sys,name)]||'';
  document.getElementById('modal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('m-text').focus(),50);
}
function closeNote(){noteIdx=null;document.getElementById('modal').classList.add('hidden');}
function saveNote(){
  if(noteIdx===null)return;
  const {sys,name}=gameMap[noteIdx];
  const k=gk(sys,name);
  const v=document.getElementById('m-text').value.trim();
  if(v){notes[k]=v;}else{delete notes[k];}
  doSave();closeNote();render();
}
document.getElementById('m-cancel').addEventListener('click',closeNote);
document.getElementById('m-save').addEventListener('click',saveNote);
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeNote();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNote();});

function doExport(){
  const b=new Blob([JSON.stringify({c:completed,n:notes},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vault_save.json';a.click();
  const s=document.getElementById('sstatus');s.textContent='Exported!';
  setTimeout(()=>s.textContent='Auto-saves in browser · Export to back up progress',3000);
}
function doImport(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{const d=JSON.parse(ev.target.result);completed=d.c||{};notes=d.n||{};doSave();render();
    const s=document.getElementById('sstatus');s.textContent='Imported!';
    setTimeout(()=>s.textContent='Auto-saves in browser · Export to back up progress',3000);
  }catch(err){alert('Invalid save file');}};
  r.readAsText(f);
}
function dlHTML(){
  const blob=new Blob([document.documentElement.outerHTML],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='The_Vault.html';a.click();
}

loadSave();render();
</script>
</body>
